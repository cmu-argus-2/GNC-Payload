# Path to the folder containing directories named with MGRS region IDs containing geotiff files used for image simulation
geotiff_folder: /path/to/geotiff/folder
# The name of the Earth Engine project that will be used by image_simulator/eedl.py to fetch the geotiff files
earth_engine_project_name: your_earth_engine_project_name
# The directory where the Blue Marble Next Generation dataset is stored
blue_marble_directory: /path/to/blue_marble/directory
